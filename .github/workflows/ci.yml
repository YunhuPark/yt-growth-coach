name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FFMPEG_PATH: /usr/bin/ffmpeg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # a Korean font lets the render tests run instead of being skipped; the system ffmpeg has the text filter the bundled Linux one lacks
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-nanum
      - run: npm ci
      # LayoutProps and friends are generated by Next, so they exist only after this
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # the public demo is the same code built with the flag on; it must keep building
      - run: NEXT_PUBLIC_DEMO=1 npm run build
